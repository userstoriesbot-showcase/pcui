# Showcase fork only (never part of an upstream pull request).
version: 1
app:
  install: "npm ci && npm run build:storybook"
  start: python3 -m http.server {port} --bind 0.0.0.0 --directory storybook
  url: http://localhost:{port}
  readyPath: /iframe.html
  readyStatus: 200
  runtime: node22
  env:
    NODE_ENV: development
demo:
  maxVideos: 1
  beforePass: true
